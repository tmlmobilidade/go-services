name: Docker images

on:
  push:
    branches: [prd]
    paths:
      - "**/Dockerfile"
      - "**/Dockerfile.*"

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed Dockerfiles
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            FILES="$(git diff --name-only HEAD~1 HEAD | grep -E '(^|/)Dockerfile(\.[^/]+)?$' || true)"
          else
            FILES="$(git ls-files | grep -E '(^|/)Dockerfile(\.[^/]+)?$' || true)"
          fi

          ENTRIES=()
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            dir="$(dirname "$f")"
            base="$(basename "$f")"

            if [ "$base" = "Dockerfile" ]; then
              name="$dir"
              file="Dockerfile"
            elif [[ "$base" == Dockerfile.* ]]; then
              name="${base#Dockerfile.}"
              file="$base"
            else
              continue
            fi

            ENTRIES+=("$(jq -nc \
              --arg name "$name" \
              --arg context "$dir" \
              --arg file "$file" \
              '{name:$name,context:$context,file:$file}')")
          done <<< "$FILES"

          if [ "${#ENTRIES[@]}" -eq 0 ]; then
            echo "No Dockerfiles changed"
            exit 1
          fi

          MATRIX="$(printf '%s\n' "${ENTRIES[@]}" | jq -s -c '{include: .}')"
          echo "Matrix: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
