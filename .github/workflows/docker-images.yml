name: Docker images

on:
  push:
    branches: [prd]
    paths:
      - "**/Dockerfile"

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed Dockerfiles
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            FILES="$(git diff --name-only HEAD~1 HEAD -- '**/Dockerfile')"
          else
            FILES="$(git ls-files '**/Dockerfile')"
          fi

          MODULES="$(echo "$FILES" | sed -n 's|/Dockerfile$||p' | sort -u)"
          echo "Modules:"
          echo "$MODULES"

          MATRIX="$(echo "$MODULES" | jq -R -s -c '
            { include: (split("\n") | map(select(length > 0) | { name: . })) }
          ')"

          if [ "$(echo "$MATRIX" | jq '.include | length')" -eq 0 ]; then
            echo "No Dockerfiles changed"
            exit 1
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.name }}
          file: ./${{ matrix.name }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
