name: Docker images

on:
  push:
    branches: [prd]
    paths-ignore:
      - ".github/**"
      - "LICENSE"
      - "README.md"

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect service to rebuild
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            CHANGED="$(git diff --name-only HEAD~1 HEAD)"
          else
            CHANGED="$(git ls-files)"
          fi

          echo "Changed files:"
          echo "$CHANGED"

          # Top-level dirs that contain a Dockerfile / Dockerfile.*
          SERVICES="$(
            echo "$CHANGED" \
              | awk -F/ 'NF >= 1 && $1 != "" && $1 != ".github" { print $1 }' \
              | sort -u \
              | while read -r dir; do
                  [ -d "$dir" ] || continue
                  if compgen -G "$dir/Dockerfile" > /dev/null \
                    || compgen -G "$dir/Dockerfile.*" > /dev/null; then
                    echo "$dir"
                  fi
                done
          )"

          echo "Services:"
          echo "$SERVICES"

          ENTRIES=()
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue

            if [ -f "$dir/Dockerfile" ]; then
              ENTRIES+=("$(jq -nc \
                --arg name "$dir" \
                --arg context "$dir" \
                --arg file "Dockerfile" \
                '{name:$name,context:$context,file:$file}')")
            fi

            for f in "$dir"/Dockerfile.*; do
              [ -f "$f" ] || continue
              base="$(basename "$f")"
              name="${base#Dockerfile.}"
              ENTRIES+=("$(jq -nc \
                --arg name "$name" \
                --arg context "$dir" \
                --arg file "$base" \
                '{name:$name,context:$context,file:$file}')")
            done
          done <<< "$SERVICES"

          if [ "${#ENTRIES[@]}" -eq 0 ]; then
            echo "No service images to build"
            exit 1
          fi

          MATRIX="$(printf '%s\n' "${ENTRIES[@]}" | jq -s -c '{include: .}')"
          echo "Matrix: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
