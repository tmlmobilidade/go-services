name: Docker images

on:
  push:
    branches: [prd]
    paths-ignore:
      - ".github/**"
      - "LICENSE"
      - "README.md"
  workflow_dispatch:
    inputs:
      pull_base:
        description: Pull latest base images (FROM) before build
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect images to build
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          ENTRIES=()
          add_dockerfile() {
            local f="$1"
            local dir base name file
            dir="$(dirname "$f")"
            base="$(basename "$f")"
            if [ "$base" = "Dockerfile" ]; then
              name="$dir"
              file="Dockerfile"
            elif [[ "$base" == Dockerfile.* ]]; then
              name="${base#Dockerfile.}"
              file="$base"
            else
              return 0
            fi
            ENTRIES+=("$(jq -nc \
              --arg name "$name" \
              --arg context "$dir" \
              --arg file "$file" \
              '{name:$name,context:$context,file:$file}')")
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run → rebuild all images"
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              add_dockerfile "$f"
            done < <(find . -maxdepth 2 \( -name 'Dockerfile' -o -name 'Dockerfile.*' \) | sed 's|^\./||' | sort)
          else
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              CHANGED="$(git diff --name-only HEAD~1 HEAD)"
            else
              CHANGED="$(git ls-files)"
            fi

            echo "Changed files:"
            echo "$CHANGED"

            SERVICES="$(
              echo "$CHANGED" \
                | awk -F/ 'NF >= 1 && $1 != "" && $1 != ".github" { print $1 }' \
                | sort -u \
                | while read -r dir; do
                    [ -d "$dir" ] || continue
                    if compgen -G "$dir/Dockerfile" > /dev/null \
                      || compgen -G "$dir/Dockerfile.*" > /dev/null; then
                      echo "$dir"
                    fi
                  done
            )"

            echo "Services:"
            echo "$SERVICES"

            while IFS= read -r dir; do
              [ -z "$dir" ] && continue
              [ -f "$dir/Dockerfile" ] && add_dockerfile "$dir/Dockerfile"
              for f in "$dir"/Dockerfile.*; do
                [ -f "$f" ] || continue
                add_dockerfile "$f"
              done
            done <<< "$SERVICES"
          fi

          if [ "${#ENTRIES[@]}" -eq 0 ]; then
            echo "No images to build"
            exit 1
          fi

          MATRIX="$(printf '%s\n' "${ENTRIES[@]}" | jq -s -c '{include: .}')"
          echo "Matrix: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/${{ matrix.file }}
          push: true
          pull: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_base || false }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
