global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
  - job_name: motis
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets:
          - motis.go.tmlmobilidade.pt