global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
  - job_name: motis
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets:
          - motis.go.tmlmobilidade.pt
  - job_name: pr702-core-api
    scheme: https
    metrics_path: /core/api/metrics
    static_configs:
      - targets:
          - pr-702.go-stg.tmlmobilidade.pt
  - job_name: pr702-hub-api-replicas
    scheme: http
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace]
        regex: pr-702
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: hub-api
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: "5050"
        action: keep
      - source_labels: [__address__]
        regex: ([^:]+)(?::\d+)?
        replacement: $1:5050
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod